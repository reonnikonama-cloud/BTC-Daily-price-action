name: Coincheck Daily Report

on:
  schedule:
    # 毎日 UTC 14:55 (JST 23:55) に実行
    - cron: '55 14 * * *'
  workflow_dispatch: # 手動実行ボタンを有効化

jobs:
  run-report:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write  # コミット・プッシュ権限

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Script
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python main.py

      - name: Commit & Push updated price_data.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 変更があるファイルをすべて自動でステージング（ファイル名違いにも対応）
          git add -A
          
          # 変更がある場合のみコミット＆プッシュ
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update price data [skip ci]" && git push)
