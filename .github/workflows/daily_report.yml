name: Coincheck Daily Report

on:
  schedule:
    # JST 00:00 (UTC 15:00) ➔ 始値 (Open) 保存用
    - cron: '0 15 * * *'
    # JST 23:55 (UTC 14:55) ➔ 終値 (Close) 比較 & Discord通知用
    - cron: '55 14 * * *'
  workflow_dispatch: # 手動実行ボタンを有効化

jobs:
  run-report:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write  # price_data.json のコミット・プッシュに必要

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Script
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python main.py

      - name: Commit & Push updated price_data.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 更新された price_data.json などの変更をすべてステージング
          git add -A
          
          # 変更がある場合のみコミット＆プッシュ（[skip ci] で無限ループ防止）
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update price data [skip ci]" && git push)
