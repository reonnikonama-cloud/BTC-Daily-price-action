name: 5min Snapshot Collector

on:
  workflow_dispatch:  # cron-job.org 等からの呼び出し用

jobs:
  run-snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # GitHubへのプッシュ権限を明示的に付与

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Snapshot
        run: python main.py --snapshot

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/
          git commit -m "Update snapshot and price data" || exit 0
          git push
