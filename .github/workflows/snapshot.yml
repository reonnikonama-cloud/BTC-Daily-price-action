name: 30min Snapshot Collector

on:
  schedule:
    # 30分間隔で実行 (UTC表記: 毎時 00分 / 30分)
    - cron: '0,30 * * * *'
  workflow_dispatch:

jobs:
  collect-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Snapshot
        env:
          DISCORD_WEBHOOK_DEBUG_LOG: ${{ secrets.DISCORD_WEBHOOK_DEBUG_LOG }}
        run: python main.py --snapshot

      - name: Commit Snapshot
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: record 30min snapshot [skip ci]" && git push)
