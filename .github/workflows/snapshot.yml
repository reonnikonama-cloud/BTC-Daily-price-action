name: 30min Snapshot Collector

on:
  workflow_dispatch:  # cron-job.org からの呼び出し専用にするため schedule は削除

jobs:
  run-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Snapshot
        run: python main.py --snapshot
