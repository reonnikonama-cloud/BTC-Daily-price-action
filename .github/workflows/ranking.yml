name: Daily Crypto Ranking

on:
  schedule:
    # JST 23:50 (UTC 14:50) に実行
    - cron: '50 14 * * *'
  workflow_dispatch:

jobs:
  send-ranking:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ranking Report
        env:
          DISCORD_WEBHOOK_RANKING: ${{ secrets.DISCORD_WEBHOOK_RANKING }}
          DISCORD_WEBHOOK_DEBUG_LOG: ${{ secrets.DISCORD_WEBHOOK_DEBUG_LOG }}
        run: python main.py --ranking
